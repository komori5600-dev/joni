<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFC Digital Business Card Editor</title>
<style>
:root{--navy:#153752;--ink:#17202a;--muted:#66727e;--panel:#fff;--line:#dfe5ea;--accent:#2b6cb0}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef2f5;color:var(--ink)}
button,input,textarea,select{font:inherit} button{cursor:pointer;border:0}
.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr;gap:0}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px;overflow:auto}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.section h2{font-size:14px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:#4b5563}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid #ccd5dd;border-radius:9px;background:#fff;outline:none}
textarea{min-height:62px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:10px 12px;border-radius:9px;font-weight:700}.primary{background:var(--navy);color:white}.secondary{background:#edf2f6;color:#203040}
.logo-list{display:flex;flex-direction:column;gap:8px}.logo-item{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);padding:7px;border-radius:9px}
.logo-item img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#f3f5f7}.logo-item input{padding:7px}.remove{background:#ffe9e9;color:#b42318;border-radius:7px;padding:6px 8px}
.preview-area{padding:34px;display:flex;flex-direction:column;align-items:center;gap:18px}
.toolbar{width:min(980px,100%);display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar .hint{font-size:13px;color:var(--muted)}
.card{width:min(980px,100%);background:var(--bg,#dfe0e2);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.15);position:relative}
.card-top{padding:34px 38px 28px;display:grid;grid-template-columns:1fr 260px;gap:24px;min-height:390px}
.card-main{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.name{font-size:31px;font-weight:900;letter-spacing:.02em;line-height:1.05}.title{font-size:19px;margin-top:8px}.role{font-size:17px;margin-top:4px}
.contacts{margin-top:22px;display:grid;gap:8px;font-size:19px;font-weight:800}.contact span{display:inline-block;min-width:34px}
.emails{font-size:15px;font-weight:500;display:grid;gap:4px;margin-top:12px}
.portrait{display:flex;align-items:flex-end;justify-content:center}.portrait img{max-width:100%;max-height:330px;object-fit:contain}
.card-bottom{background:var(--navy);color:#fff;padding:24px 34px;display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:center}
.address{text-align:center;font-size:17px;line-height:1.45}.logos{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.biz-logo{height:58px;max-width:120px;object-fit:contain;background:transparent}.biz-name{font-weight:800;font-size:18px}
.nfc-panel{width:min(980px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.nfc-panel strong{display:block}.nfc-panel small{color:var(--muted)}
.status{margin-top:8px;font-size:12px;color:#52606d}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.card-top,.card-bottom{grid-template-columns:1fr}.portrait{order:-1}.portrait img{max-height:240px}.card-main{padding-top:0}.name{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <h1>NFC Business Card</h1>
  <div class="sub">Editable digital card inspired by your attached layout.</div>

  <div class="section">
    <h2>Personal details</h2>
    <label>Name</label><input id="name" value="JONI RALPH A. STA MARIA">
    <label>Professional title</label><input id="title" value="PROPERTY SPECIALIST">
    <label>License / role</label><input id="role" value="LICENCE REAL ESTATE SALESPERSON">
    <label>Phone 1</label><input id="phone1" value="+63 945-967-2581">
    <label>Phone 2</label><input id="phone2" value="+63 968-718-6738">
    <label>WhatsApp</label><input id="phone3" value="+63 926-052-0304">
    <label>Email 1</label><input id="email1" value="joniralph.alveo@gmail.com">
    <label>Email 2</label><input id="email2" value="sta.maria.joni@alveoland.com">
    <label>Address</label><textarea id="address">ALVEO Corporate Center
728 28th Street, Bonifacio Global City
1634 Taguig City, Metro Manila, Philippines</textarea>
  </div>

  <div class="section">
    <h2>Card appearance</h2>
    <label>Background</label><input id="bg" type="color" value="#dfe0e2">
    <label>Bottom panel color</label><input id="navy" type="color" value="#153752">
    <label>Upload portrait/photo</label><input id="portraitFile" type="file" accept="image/*">
  </div>

  <div class="section">
    <h2>Business logos & names</h2>
    <div id="logoList" class="logo-list"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn secondary" id="addLogo">+ Add logo</button>
      <button class="btn secondary" id="clearLogos">Clear</button>
    </div>
    <label>Business name (shown beside logos)</label><input id="businessName" value="ALVEO • Ayala Land Premier">
  </div>

  <div class="section">
    <h2>Save / share</h2>
    <div class="row">
      <button class="btn primary" id="save">Save</button>
      <button class="btn secondary" id="vcard">Export vCard</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</aside>

<main class="preview-area">
  <div class="toolbar">
    <div class="hint">Live preview • edit any field on the left</div>
    <button class="btn primary" id="print">Print / PDF</button>
  </div>

  <section class="card" id="card">
    <div class="card-top">
      <div class="card-main">
        <div class="name" id="pName"></div>
        <div class="title" id="pTitle"></div>
        <div class="role" id="pRole"></div>
        <div class="contacts">
          <div class="contact">🌐 <span id="p1"></span></div>
          <div class="contact">📱 <span id="p2"></span></div>
          <div class="contact">🟢 <span id="p3"></span></div>
        </div>
        <div class="emails"><div id="pEmail1"></div><div id="pEmail2"></div></div>
      </div>
      <div class="portrait"><img id="pPortrait" alt="Portrait"></div>
    </div>
    <div class="card-bottom">
      <div class="address" id="pAddress"></div>
      <div class="logos" id="pLogos"></div>
    </div>
  </section>

  <div class="nfc-panel">
    <div><strong>NFC-ready</strong><small>Writes your contact as a vCard to an NFC tag on supported Android browsers.</small></div>
    <button class="btn primary" id="nfc">Write to NFC</button>
  </div>
  <div class="status" id="nfcStatus"></div>
</main>
</div>

let logos=data.logos||[
  {name:'ALVEO',src:''},{name:'Ayala Land Premier',src:''}
];

function sync(){
  fields.forEach(id=>{data[id]=$(id).value});
  data.bg=$('bg').value; data.navy=$('navy').value; data.portrait=portrait; data.logos=logos;
  $('pName').textContent=data.name; $('pTitle').textContent=data.title; $('pRole').textContent=data.role;
  $('p1').textContent=data.phone1; $('p2').textContent=data.phone2; $('p3').textContent=data.phone3;
  $('pEmail1').textContent=data.email1; $('pEmail2').textContent=data.email2;
  $('pAddress').innerHTML=escapeHtml(data.address).replace(/\n/g,'<br>');
  $('card').style.setProperty('--bg',data.bg); $('card').style.setProperty('--navy',data.navy);
  $('pPortrait').src=portrait;
  renderLogos();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderLogos(){
  const list=$('logoList'); list.innerHTML='';
  logos.forEach((l,i)=>{
    const d=document.createElement('div'); d.className='logo-item';
    d.innerHTML=`<div>${l.src?`<img src="${l.src}">`:'<div style="width:40px;height:40px;border-radius:6px;background:#eef2f5;display:grid;place-items:center">＋</div>'}</div>
      <input value="${escapeHtml(l.name)}" aria-label="Business name">
      <button class="remove" title="Remove">×</button>`;
    d.querySelector('input').oninput=e=>{logos[i].name=e.target.value;sync()};
    d.querySelector('.remove').onclick=()=>{logos.splice(i,1);sync()};
    list.appendChild(d);
  });
  const out=$('pLogos'); out.innerHTML='';
  logos.forEach(l=>{
    const wrap=document.createElement('div'); wrap.style.textAlign='center';
    if(l.src){const im=document.createElement('img');im.src=l.src;im.className='biz-logo';wrap.appendChild(im)}
    const nm=document.createElement('div');nm.className='biz-name';nm.textContent=l.name;wrap.appendChild(nm);out.appendChild(wrap);
  });
}
$('addLogo').onclick=()=>{
  const name=prompt('Business / logo name:','New Business');
  if(name===null)return;
  const input=document.createElement('input');input.type='file';input.accept='image/*';
  input.onchange=()=>{const f=input.files[0]; if(!f){logos.push({name,src:''});sync();return}
    const r=new FileReader();r.onload=()=>{logos.push({name,src:r.result});sync()};r.readAsDataURL(f)
  }; input.click();
};
$('clearLogos').onclick=()=>{logos=[];sync()};
$('portraitFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{portrait=r.result;sync()};r.readAsDataURL(f)};
fields.forEach(id=>$(id).addEventListener('input',sync));
$('bg').oninput=sync;$('navy').oninput=sync;
$('save').onclick=()=>{localStorage.setItem('nfcCardData',JSON.stringify(data));$('saveStatus').textContent='Saved on this device.'};
$('print').onclick=()=>window.print();

function makeVCard(){
 return `BEGIN:VCARD\\nVERSION:3.0\\nFN:${data.name}\\nTITLE:${data.title}\\nROLE:${data.role}\\nTEL;TYPE=CELL:${data.phone1}\\nTEL;TYPE=CELL:${data.phone2}\\nTEL;TYPE=WHATSAPP:${data.phone3}\\nEMAIL:${data.email1}\\nEMAIL:${data.email2}\\nADR:;;${data.address.replace(/\\n/g,';')}\\nORG:${data.businessName}\\nEND:VCARD`;
}
$('vcard').onclick=()=>{
 const blob=new Blob([makeVCard()],{type:'text/vcard'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='business-card.vcf';a.click();URL.revokeObjectURL(a.href);
};
$('nfc').onclick=async()=>{
 const st=$('nfcStatus');
 if(!('NDEFReader' in window)){st.textContent='Web NFC is not available here. Open this page over HTTPS on a supported Android Chrome device to write an NFC tag.';return}
 try{
  const writer=new NDEFReader(); await writer.write({records:[{recordType:'text',data:makeVCard()}]});
  st.textContent='Ready — hold the NFC tag near the phone to write the contact.';
 }catch(e){st.textContent='NFC write was cancelled or blocked: '+e.message}
};
sync();
</script>
<style>@media print{.sidebar,.toolbar,.nfc-panel,.status{display:none}.preview-area{padding:0}.card{box-shadow:none;width:100%}}</style>
